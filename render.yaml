services:
  - type: web
    name: chat99
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev && npm ci --prefix client && npm run build --prefix client
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
