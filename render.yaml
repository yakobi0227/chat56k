services:
  - type: web
    name: chat99
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    disk:
      name: chat56k-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - chat56k.com
      - www.chat56k.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
